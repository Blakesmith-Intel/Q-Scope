name: Validate StormTracker review changes

on:
  push:
    branches:
      - "release/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate JavaScript and run all frontend regression suites
        run: npm test
      - name: Validate relay JavaScript without running external services
        run: node --check relay/worker.js
      - name: Verify BoM authentic published crossing reference at source
        run: node scripts/probe-bom-qld-crossings-v1.mjs
      - name: One-off verify genuine BoM severe-warning CAP polygon availability
        if: github.head_ref == 'feature/bom-official-warning-polygons-bees-dick-20261027'
        continue-on-error: true
        run: node scripts/probe-official-bom-cap-current-v1.mjs
      - name: Verify genuine-product cyclone GML decoder contracts (offline)
        run: python3 scripts/test-bom-issued-cyclone-decoder.py

      - name: Checkout exact accepted QA source for package audit
        uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
          persist-credentials: false
      - name: Checkout exact V9.20.2 release source for package audit
        uses: actions/checkout@v4
        with:
          ref: b8be458acbae942a3bb0b530a5c17618b6d03134
          path: checked/production-v9.20.2
          persist-credentials: false
      - name: Checkout exact V10.2.0 candidate for final package audit
        uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
          persist-credentials: false
      - name: Checkout immutable V10.3 radar wind-hook QA for separate preview
        uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
          persist-credentials: false
      - name: Dry-run the identical final Pages package without deploying
        run: |
          bash -x scripts/build-current-site.sh
          test -f _site/BUILD.txt
          test -f _site/preview/radar-history-fix/BUILD.txt
          test ! -e _site/preview/next-baseline/BUILD.txt
          grep -Fq 'SEALED StormTracker V10.2.0 source 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2' _site/BUILD.txt
          grep -Fq 'createSupplementalDopplerDisplay' _site/src/live3d-operational-v9.js
          grep -Fq '"No current warnings"' _site/src/internal-cyclone-live-qa-v1.js
          grep -Fq 'Cyclone forecast feed unavailable' _site/src/internal-cyclone-live-qa-v1.js
          grep -Fq 'supplementalDopplerDisplay.prepare(source.observedUtc)' _site/src/live3d-operational-v9.js
          grep -Fq 'supplementalDopplerDisplay.commit(source.observedUtc)' _site/src/live3d-operational-v9.js
          grep -Fq 'function commit(utc)' _site/src/multi-doppler-display-v1.js
          test -s _site/src/multi-doppler-display-v1.js
          node --check _site/src/internal-cyclone-live-qa-v1.js
          grep -Fq 'PUBLISHED_PRODUCTION_RUNTIME' _site/src/live3d-operational-v9.js
          grep -Fq 'incrementalVolumeRenderer.upsert(pixelIndex,category,nextSpecs' _site/src/live3d-operational-v9.js
          grep -Fq 'GLOBAL_SATELLITE_FALLBACK' _site/src/context-layers/basemap-manager-v1.js
          grep -Fq 'createGlobalSatelliteFallbackProvider' _site/src/context-layers/basemap-manager-v1.js
          grep -Fq 'global-satellite-blue-gap-20261016-v1' _site/src/live3d-operational-v9.js
          grep -Fq 'satellite-blue-gap-qa-v1' _site/index.html
          grep -Fq 'satellite-blue-gap-qa-v1' _site/live3d-operational-v9.html
          grep -Fq 'v9.20.0-optimised-3d-prod' _site/live3d-operational-v9.html
          grep -Fq 'v9.20.0-optimised-3d-prod' _site/index.html
          grep -Fq 'selectSupplementalVolumeSampleIndices' _site/src/supplemental-radar-volume-v1.js
          grep -Fq 'hashSupplementalPixel' _site/src/supplemental-volume-sampling-v1.js
          grep -Fq 'secondarySiteGlyphs' _site/src/live3d-operational-v9.js
          grep -Fq 'v9.20.1-secondary-3d-fix' _site/index.html
          grep -Fq 'v9.20.1-secondary-3d-fix' _site/live3d-operational-v9.html
          test -f _site/preview/incremental-3d/BUILD.txt
          grep -Fq 'EXPERIMENTAL incremental 3-D QA' _site/preview/incremental-3d/BUILD.txt
          test "$(find _site/preview -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 5
          # Q-SCOPE passive alerts are a separate fifth experimental preview,
          # never a newly activated operational or BoM-authoritative layer.
          test -s _site/preview/wind-hook-v10-5/BUILD.txt
          grep -Fq 'Q-SCOPE PASSIVE WIND/HOOK RESEARCH V10.5' _site/preview/wind-hook-v10-5/BUILD.txt
          grep -Fq 'createPassiveWindEventInbox' _site/preview/wind-hook-v10-5/src/live3d-operational-v9.js
          grep -Fq 'queuePassiveResearchPair("rain",i)' _site/preview/wind-hook-v10-5/src/live3d-operational-v9.js
          ! grep -Fq 'enableWindHookResearch' _site/preview/wind-hook-v10-5/src/live3d-operational-v9.js
          grep -Fq 'Q-SCOPE WIND / HOOK RESEARCH V10.4' _site/preview/wind-hook-v10-4/BUILD.txt
          # V10.4 is an ADDITIONAL opt-in research path; all three earlier
          # original-source QA previews must survive with their exact markers.
          test -s _site/preview/wind-hook-v10-4/BUILD.txt
          grep -Fq 'Q-SCOPE WIND / HOOK RESEARCH V10.4' _site/preview/wind-hook-v10-4/BUILD.txt
          grep -Fq 'Q-SCOPE</strong><span>WIND / HOOK RESEARCH' _site/preview/wind-hook-v10-4/live3d-operational-v9.html
          grep -Fq 'ADJACENCY_KM = 1.5' _site/preview/wind-hook-v10-4/src/doppler-persistence-v10-3.js
          grep -Fq 'MAX_ARC_GAP_MINUTES = 8' _site/preview/wind-hook-v10-4/src/severe-storm-v10.js
          ! grep -Fq 'assessV10RadarFrame' _site/src/live3d-operational-v9.js

          test -s _site/preview/wind-hook-v10-3/BUILD.txt
          grep -Fq 'f3a07688ca02f5f0234ae6425fc1177722518c53' _site/preview/wind-hook-v10-3/BUILD.txt
          test -s _site/preview/wind-hook-v10-3/assets/v10-tornado.svg
          ! grep -Fq 'isWindHookQaPreview' _site/src/live3d-operational-v9.js
