name: Seal operator-approved Q-SCOPE 26 November 2026 restore point
on:
  workflow_run:
    workflows:
      - Deploy StormTracker — V10.2.45 verified radar production and historical QA
      - Release gate — V10 native BoM high-res radar + AEP
      - Deploy existing StormTracker production Cloudflare relay
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: qscope-20261126-seal
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify exact source and all three completed guards before creating immutable refs
        env:
          GH_TOKEN: ${{ secrets.STORMTRACKER_RELEASE_TOKEN || github.token }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$TRIGGER_SHA"
          tag=qscope-2026-11-26
          branch=restore/qscope-2026-11-26
          main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$sha" = "$main" || { echo "Not the current main release; no seal"; exit 0; }
          msg="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.commit.message')"
          test "$msg" = "Q-SCOPE 2026-11-26: repair rainfall release guards and prepare approved seal" || { echo "Not the approved release commit; no seal"; exit 0; }
          for workflow in pages.yml qa-ftp-aep-combined-release-v1.yml deploy-relay.yml; do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$sha&branch=main&per_page=10" --jq '.workflow_runs | sort_by(.run_number) | last // {}')"
            conclusion="$(jq -r '.conclusion // "pending"' <<< "$run")"
            run_id="$(jq -r '.id // "none"' <<< "$run")"
            echo "$workflow run $run_id: $conclusion"
            if [ "$conclusion" != success ]; then echo "Release not eligible for seal"; exit 0; fi
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$sha"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$existing" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$sha" >/dev/null
          else
            test "$existing" = "$sha"
          fi
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$existing" ]; then
            object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$tag" -f object="$sha" -f type=commit -f message="Q-SCOPE 26 November 2026 operator-approved exact source; Pages, native radar/AEP browser guard and live relay verified." --jq '.sha')"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$object" >/dev/null
          fi
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')" = "$sha"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')" = "$sha"
          echo "SEALED $tag and $branch => $sha"
