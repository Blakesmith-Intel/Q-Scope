name: Review system-wide incremental radar (genuine BoM, mobile and desktop)
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "frontend/tests/**"
      - "frontend/src/radar-source.js"
      - "frontend/src/bom-wmts-loop-v2.js"
      - "scripts/apply-radar-auto-refresh-v1.py"
      - "scripts/audit-gympie-gladstone-wmts-20261101.mjs"
      - "scripts/audit-all-radar-wmts-spotcheck-20261101.mjs"
      - "scripts/test-gympie-gladstone-incremental-webkit-20261101.mjs"
      - "scripts/test-incremental-append-real-wmts-webkit-20261101.mjs"
      - ".github/workflows/radar-incremental-gympie-gladstone-review.yml"
permissions:
  contents: read
concurrency:
  group: incremental-radar-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  exact-tiles:
    if: github.head_ref == 'feature/incremental-radar-frames-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - name: Verify universal review/production tile-pressure guard and transient preflight retry
        run: node frontend/tests/run-radar-wmts-pressure-preflight-v10-2-44-tests.mjs
      - name: Verify actual six published timestamps and every Gympie/Gladstone tile
        run: node scripts/audit-gympie-gladstone-wmts-20261101.mjs
      - name: Verify published imagery samples for every registered QLD/NSW radar region
        run: node scripts/audit-all-radar-wmts-spotcheck-20261101.mjs

  genuine-mobile:
    if: github.head_ref == 'feature/incremental-radar-frames-20261101'
    needs: exact-tiles
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
      - uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
      - uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
      - name: Build actual operator application, never deploy to Pages
        run: |
          bash scripts/build-current-site.sh
          python scripts/apply-ftp-aep-release-v10.py
          python scripts/apply-radar-auto-refresh-v1.py
          grep -Fq 'planIncrementalRadarWindow(hybridFrames,displayFrames)' _site/src/live3d-operational-v9.js
          grep -Fq 'v10.2.43-incremental-radar-' _site/index.html
          node --check _site/src/live3d-operational-v9.js
          node --check _site/src/bom-wmts-loop-v2.js
          node --check _site/src/continuous-playback-v1.js
      - name: Install mobile WebKit and desktop Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps webkit chromium
      - name: Repeated real radar checks across seven regions and GPU/browser continuity
        run: |
          python -m http.server 8137 --bind 127.0.0.1 --directory _site >/tmp/st-radar-review.log 2>&1 &
          node scripts/test-gympie-gladstone-incremental-webkit-20261101.mjs
      - name: Require genuine WMTS frame insertion without mobile Safari player/page restart
        run: node scripts/test-incremental-append-real-wmts-webkit-20261101.mjs
      - name: Require same genuine WMTS frame insertion without desktop Chromium player/page restart
        run: STORMTRACKER_BROWSER=desktop node scripts/test-incremental-append-real-wmts-webkit-20261101.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: incremental-radar-webkit-failure
          path: |
            /tmp/incremental-radar-webkit-failure.png
            /tmp/radar-incremental-real-append-failure.png
            /tmp/radar-incremental-desktop-append-failure.png
          if-no-files-found: ignore
