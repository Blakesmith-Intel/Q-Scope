name: Q-Scope BoM wind observation candidate
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/context-layers/qscope-bom-wind-observation-model-v1.js'
      - 'frontend/src/context-layers/qscope-bom-wind-observations-operational-v1.js'
      - 'frontend/tests/run-qscope-bom-wind-observations-v1-tests.mjs'
      - 'relay/qld-wind-observations-v1.js'
      - '.github/workflows/qa-qscope-bom-wind-observations-v1.yml'
  workflow_dispatch:
jobs:
  wind-observations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated wind syntax
        run: |
          node --check frontend/src/context-layers/qscope-bom-wind-observation-model-v1.js
          node --check frontend/src/context-layers/qscope-bom-wind-observations-operational-v1.js
          node --check relay/qld-wind-observations-v1.js
      - name: Test official thresholds, XML and 24h sample model
        run: node frontend/tests/run-qscope-bom-wind-observations-v1-tests.mjs
