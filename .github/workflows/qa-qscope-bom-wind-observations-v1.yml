name: Q-Scope BoM wind observation candidate
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/context-layers/qscope-bom-wind-observation-model-v1.js'
      - 'frontend/src/context-layers/qscope-bom-wind-observations-operational-v1.js'
      - 'frontend/tests/run-qscope-bom-wind-observations-v1-tests.mjs'
      - 'relay/qld-wind-observations-v1.js'
      - '.github/workflows/qa-qscope-bom-wind-observations-v1.yml'
  workflow_dispatch:
jobs:
  wind-observations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated wind syntax
        run: |
          node --check frontend/src/context-layers/qscope-bom-wind-observation-model-v1.js
          node --check frontend/src/context-layers/qscope-bom-wind-observations-operational-v1.js
          node --check relay/qld-wind-observations-v1.js
      - name: Test official thresholds, XML and 24h sample model
        run: node frontend/tests/run-qscope-bom-wind-observations-v1-tests.mjs
      - name: Check actual public BoM state XML and one station JSON
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import {parseQueenslandWindXml,sampledWindPeak24h} from './frontend/src/context-layers/qscope-bom-wind-observation-model-v1.js';
          const source='https://www.bom.gov.au/fwo/IDQ60920.xml';
          const response=await fetch(source,{signal:AbortSignal.timeout(25000)});
          if(!response.ok)throw Error('BoM state XML not available to CI: '+response.status);
          const raw=await response.text();
          const stations=parseQueenslandWindXml(raw);
          console.log('Verified station count: '+stations.length);
          const station=stations.find(s=>s.gustKmh!==null&&s.current);
          if(!station)throw Error('No verified current gust station from BoM');
          const endpoint='https://www.bom.gov.au/fwo/IDQ60801/IDQ60801.'+station.wmo+'.json';
          const historyResponse=await fetch(endpoint,{signal:AbortSignal.timeout(25000)});
          if(!historyResponse.ok)throw Error('BoM station JSON not available to CI: '+historyResponse.status);
          const peak=sampledWindPeak24h(await historyResponse.json(),{wmo:station.wmo});
          if(!peak)throw Error('BoM station rolling 24h sample not verified');
          console.log('Verified one station 24h samples: '+peak.sampleCount);
          NODE
