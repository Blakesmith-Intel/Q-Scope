name: One-shot official BoM gauge-source diagnostics
on:
  push:
    branches: [fix/simple-bom-gauge-catalogue-20261110]
    paths: [.github/workflows/probe-bom-gauge-metadata-20261110.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact original BoM source and same-source MapServer independently
        run: |
          node --input-type=module <<'NODE'
          const root='https://hosting.wsapi.cloud.bom.gov.au/arcgis/rest/services/flood/National_Flood_Gauge_Network';
          const params=new URLSearchParams({
            where:"state='QLD'",
            outFields:"bom_stn_num,awrc_stateid,name,lat,long,state,location_types,forecast_site_classification,basin,agency,featreal",
            returnGeometry:"true",outSR:"4326",f:"geojson"
          });
          const qra='https://gisservices.qra.qld.gov.au/arcgis/rest/services/FWIN/BoM_SLS_Gauges/FeatureServer/0/query';
          const qraParams=new URLSearchParams({where:'1=1',
            outFields:'Bureau_Number,Agency_Number,Station_Name,State,Basin,Bureau_Latitude__4_decimal_plac,Bureau_Longitude__4_decimal_pla,Bureau_updated_Latitude__6_deci,Bureau_updated_Longitude__6_dec,Schedule_2___Forecast_location,Schedule_3___Information_locati,Schedule_4___Data_locations,Gauge__Type',
            returnGeometry:'true',outSR:'4326',f:'geojson'});
          const qld='https://spatial-gis.information.qld.gov.au/arcgis/rest/services/FloodCheck/FloodWarningNetworkBOM/MapServer/0/query';
          const qldParams=new URLSearchParams({where:'1=1',outFields:'*',
            returnGeometry:'true',outSR:'4326',f:'geojson',resultRecordCount:'5'});
          const jobs=[
            ['QRA BoM SLS full',qra+'?'+qraParams],
            ['QRA BoM SLS count',qra+'?where=1%3D1&returnCountOnly=true&f=json'],
            ['QRA BoM SLS sample',qra+'?'+qraParams+'&resultRecordCount=5'],
            ['QLD FloodCheck BoM sample',qld+'?'+qldParams],
            ['QLD FloodCheck BoM count',qld+'?where=1%3D1&returnCountOnly=true&f=json'],
            ['FeatureServer original full',root+'/FeatureServer/5/query?'+params],
            ['MapServer same-layer full',root+'/MapServer/5/query?'+params],
            ['FeatureServer 10-gauge',root+'/FeatureServer/5/query?'+params+'&resultRecordCount=10'],
            ['MapServer 10-gauge',root+'/MapServer/5/query?'+params+'&resultRecordCount=10'],
            ['FeatureServer count',root+'/FeatureServer/5/query?where=state%3D%27QLD%27&returnCountOnly=true&f=json'],
          ];
          await Promise.all(jobs.map(async([name,url])=>{
            const began=Date.now();
            try{
              const response=await fetch(url,{signal:AbortSignal.timeout(18000),
                headers:{Accept:'application/geo+json,application/json'}});
              const raw=await response.text();
              let p={};try{p=JSON.parse(raw);}catch{}
              console.log(JSON.stringify({name,status:response.status,elapsedMs:Date.now()-began,
                bytes:raw.length,features:p.features?.length??null,count:p.count??null,
                type:p.type??null,error:p.error?.message??null,preview:raw.slice(0,100)}));
            }catch(e){console.log(JSON.stringify({name,elapsedMs:Date.now()-began,error:String(e)}));}
          }));
          NODE
      - name: Compare official Queensland gauge networks with BoM 2026 audit
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const audit=JSON.parse(readFileSync("docs/BOM_2026_GAUGE_COVERAGE_AUDIT.json","utf8"));
          const original=new Set(audit.stations.map(s=>s.station));
          const providers=[
            {name:"QRA_SLS",url:"https://gisservices.qra.qld.gov.au/arcgis/rest/services/FWIN/BoM_SLS_Gauges/FeatureServer/0/query",
              fields:"Bureau_Number,Agency_Number,Station_Name,State,Basin,Bureau_updated_Latitude__6_deci,Bureau_updated_Longitude__6_dec,Schedule_2___Forecast_location,Schedule_3___Information_locati,Schedule_4___Data_locations,Gauge__Type",
              id:"Bureau_Number"},
            {name:"QLD_FloodCheck",url:"https://spatial-gis.information.qld.gov.au/arcgis/rest/services/FloodCheck/FloodWarningNetworkBOM/MapServer/0/query",
              fields:"gaugeno,stn_name,basin,agency,instrument_type",id:"gaugeno"}
          ];
          const all={};
          await Promise.all(providers.map(async provider=>{
            const rows=[];
            for (const offset of [0,2000]){
              const params=new URLSearchParams({where:"1=1",
                outFields:provider.fields,returnGeometry:"true",outSR:"4326",f:"geojson",
                resultOffset:String(offset),resultRecordCount:"2000",
                orderByFields:provider.name==="QRA_SLS"?"OBJECTID":"objectid"});
              const started=Date.now();
              const response=await fetch(provider.url+"?"+params,{signal:AbortSignal.timeout(14000)});
              if(!response.ok)throw Error(provider.name+" HTTP "+response.status);
              const body=await response.json();
              if(!Array.isArray(body.features))throw Error(provider.name+" malformed JSON");
              rows.push(...body.features);
              console.log(provider.name+" page "+offset+": "+body.features.length+
                " in "+(Date.now()-started)+"ms");
            }
            const mapped=new Map(),duplicates=[];
            for(const f of rows){
              const raw=String(f.properties?.[provider.id]??"").trim();
              if(!/^\d{1,6}$/.test(raw))continue;
              const key="bom:"+raw.padStart(6,"0");
              if(mapped.has(key))duplicates.push(key);
              else mapped.set(key,f);
            }
            all[provider.name]=mapped;
            const matches=[...mapped.keys()].filter(x=>original.has(x));
            const present=rows.filter(f=>String(f.properties?.State??"").toUpperCase()==="QLD").length;
            console.log(JSON.stringify({
              provider:provider.name,rawRows:rows.length,uniqueIds:mapped.size,duplicates:duplicates.length,
              matchingBoMAudit:matches.length,auditCount:original.size,
              qldRows:present,examples:rows.slice(0,3).map(f=>f.properties),
              auditMissing:[...original].filter(x=>!mapped.has(x)).slice(0,12)
            }));
          }));
          const union=new Set([...all.QRA_SLS.keys(),...all.QLD_FloodCheck.keys()]);
          console.log(JSON.stringify({
            unionMatchingAudit:[...original].filter(x=>union.has(x)).length,
            overlap:[...all.QRA_SLS.keys()].filter(x=>all.QLD_FloodCheck.has(x)).length,
            twoSources:[...all.QRA_SLS.keys()].filter(x=>
              original.has(x)&&all.QLD_FloodCheck.has(x)).length
          }));
          NODE
