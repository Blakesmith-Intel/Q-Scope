name: Verify authentic active warning polygons recover on iPhone and desktop
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/src/context-layers/bom-warning-operational-v1.js"
      - "frontend/tests/run-bom-warning-live-geometry-catchup-v10-2-46-tests.mjs"
      - "frontend/tests/run-bom-four-product-warning-menu-v1-tests.mjs"
      - "scripts/test-warning-geometry-recovery-browser-20261101.mjs"
      - "scripts/build-current-site.sh"
      - ".github/workflows/warning-polygon-source-browser-20261101.yml"
permissions:
  contents: read
jobs:
  browser-warning-recovery:
    if: github.head_ref == 'feature/warning-polygon-source-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        platform: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
      - uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
      - uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
      - name: Verify warning state, source, and 15 minute normal polling contracts
        run: |
          node frontend/tests/run-bom-warning-live-geometry-catchup-v10-2-46-tests.mjs
          node frontend/tests/run-bom-four-product-warning-menu-v1-tests.mjs
          node frontend/tests/run-bom-warning-product-cancel-refresh-v1-tests.mjs
      - name: Assemble actual production package with scoped warning-only correction
        run: |
          bash scripts/build-current-site.sh
          python scripts/apply-ftp-aep-release-v10.py
          python scripts/apply-radar-auto-refresh-v1.py
          grep -Fq 'v10-2-46-live-polygon-catchup' _site/src/live3d-operational-v9.js
          grep -Fq 'WARNING_GEOMETRY_RECOVERY_MS=2*60*1000' _site/src/context-layers/bom-warning-operational-v1.js
          grep -Fq 'INTERVAL_MS=15*60*1000' _site/src/context-layers/bom-warning-operational-v1.js
          node --check _site/src/live3d-operational-v9.js
          node --check _site/src/context-layers/bom-warning-operational-v1.js
      - name: Install test engine
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps ${{ matrix.platform == 'desktop' && 'chromium' || 'webkit' }}
      - name: Reproduce unverified active geometry then recover genuine official polygons without navigation
        run: |
          python -m http.server 8137 --bind 127.0.0.1 --directory _site >/tmp/st-warning-recovery-browser.log 2>&1 &
          STORMTRACKER_BROWSER=${{ matrix.platform }} node scripts/test-warning-geometry-recovery-browser-20261101.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: warning-recovery-${{ matrix.platform }}-fail
          path: |
            /tmp/warning-desktop-catchup-fail.png
            /tmp/warning-mobile-catchup-fail.png
            /tmp/st-warning-recovery-browser.log
          if-no-files-found: ignore
