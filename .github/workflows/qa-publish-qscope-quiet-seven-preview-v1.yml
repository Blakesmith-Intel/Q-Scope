name: Publish isolated Q-SCOPE quiet refresh, branded header and genuine seven-frame PR330 preview

on:
  push:
    branches:
      - feature/qscope-quiet-refresh-and-premium-brand-20261112
    paths:
      - "frontend/**"
      - "relay/**"
      - "scripts/**"
      - "wrangler.qscope-wind-qa-preview.jsonc"
      - ".github/workflows/qa-publish-qscope-quiet-seven-preview-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qscope-pr330-quiet-seven-qa-preview
  cancel-in-progress: true

jobs:
  publish-quiet-seven-preview:
    if: github.ref == 'refs/heads/feature/qscope-quiet-refresh-and-premium-brand-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Checkout approved V9.18 diagnostic source (immutable)
        uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
          persist-credentials: false
      - name: Checkout approved production V10.2 source (immutable)
        uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
          persist-credentials: false
      - name: Checkout original V10.3 research preview (immutable)
        uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
          persist-credentials: false
      - name: Assemble actual operational Q-SCOPE candidate, not a mocked screenshot
        run: |
          set -euo pipefail
          npm test
          bash scripts/build-current-site.sh
          # The sealed build already applies every approved source overlay and
          # the final read-only UI + 7-frame correction. NEVER double-apply
          # pinned radar/AEP code against the finished module import graph.
          python3 scripts/prepare-qscope-quiet-seven-preview-v1.py
          grep -Fq 'Q-SCOPE PREMIUM UI 12 COUNTDOWNS AND 7 GENUINE RADAR FRAMES PR330 REVIEW ONLY' _wind_preview_assets/BUILD.txt
          grep -Fq 'BO_M WIND OBSERVATION PRODUCT' _wind_preview_assets/BUILD.txt
          grep -Fq 'id="showBomWindObservations"' _wind_preview_assets/live3d-operational-v9.html
          grep -Fq 'id="powerOutageExplorerCountdown"' _wind_preview_assets/live3d-operational-v9.html
          grep -Fq 'id="qscopeRadarCountdown"' _wind_preview_assets/live3d-operational-v9.html
          grep -Fq 'qscope-seal' _wind_preview_assets/live3d-operational-v9.html
          grep -Fq 'const targetSpanMinutes = minutes;' _wind_preview_assets/src/radar-history-window-v1.js
          grep -Fq 'Q-SCOPE QUIET SOURCE-SCHEDULED COUNTDOWNS' _wind_preview_assets/BUILD.txt
          ! grep -Fq 'id="refreshPowerOutageExplorer"' _wind_preview_assets/live3d-operational-v9.html
          grep -Fq 'qscopeOperationalWindEvents.queueWindow(mode,frames.length)' _wind_preview_assets/src/live3d-operational-v9.js
          grep -Fq 'PUBLISHED_PRODUCTION_RUNTIME' _wind_preview_assets/src/live3d-operational-v9.js
          test ! -d _wind_preview_assets/preview
          node --check scripts/qscope-wind-qa-worker-v1.js
          node --check _wind_preview_assets/src/live3d-operational-v9.js
          node --check _wind_preview_assets/src/context-layers/qscope-bom-wind-observations-operational-v1.js
      - name: Publish branch preview under existing Worker WITHOUT production deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview --config wrangler.qscope-wind-qa-preview.jsonc --name qscope-ui-seven-pr330
      - name: Prove public preview URL and official observations are accessible
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://qscope-ui-seven-pr330-stormtracker-bom-relay.stormtracker-bom-relay.workers.dev';
          let health=null;
          let failure='';
          for(let i=0;i<9;i++){
            try{
              const r=await fetch(base+'/__qscope-preview-health',{signal:AbortSignal.timeout(16000)});
              if(r.status===200){health=await r.json();break;}
              failure='HTTP '+r.status;
            }catch(err){failure=String(err);}
            await new Promise(resolve=>setTimeout(resolve,4000));
          }
          assert(health,'Public operator preview not reachable: '+failure);
          assert.equal(health.preview,true);
          const landing=await fetch(base+'/',{signal:AbortSignal.timeout(12000)});
          assert.equal(landing.status,200,'Root preview shell unavailable');
          assert.match(await landing.text(),/Q-SCOPE UI & SEVEN RADAR FRAMES QA PREVIEW/);
          const ui=await fetch(base+'/live3d-operational-v9.html',{signal:AbortSignal.timeout(12000)});
          assert.equal(ui.status,200,'Operator preview unavailable');
          const operatorHtml=await ui.text();
          assert.match(operatorHtml,/showBomWindObservations/);
          assert.match(operatorHtml,/qscopeRadarCountdown/);
          assert.match(operatorHtml,/qscope-seal/);
          assert.match(operatorHtml,/qscopeClock_refreshOfficialBomWarnings/);
          const radarFrame=await fetch(base+'/src/radar-history-window-v1.js');
          assert.equal(radarFrame.status,200);
          assert.match(await radarFrame.text(),/const targetSpanMinutes = minutes/);
          const clocks=await fetch(base+'/src/qscope-quiet-refresh-clocks-v1.js');
          assert.equal(clocks.status,200);
          assert.match(await clocks.text(),/__qscopePollClock/);
          const outageSource=await fetch(base+'/src/context-layers/power-outage-suburb-explorer-v1.js');
          assert.equal(outageSource.status,200);
          assert.match(await outageSource.text(),/formatPowerOutageRefreshCountdown/);
          const relay=await fetch(base+'/qld-wind-observations',{signal:AbortSignal.timeout(25000)});
          assert.equal(relay.status,200,'Preview BoM relay returned '+relay.status);
          const json=await relay.json();
          assert.equal(json.product,'IDQ60920');
          assert(json.observations.length>50,'Verified BoM observations missing');
          const invalid=await fetch(base+'/qld-wind-observations?wmo=nope');
          assert.equal(invalid.status,400,'Malformed station must not pass');
          console.log('OPERATOR_PREVIEW_PUBLISHED_AND_VERIFIED',base,
            'official stations',json.observations.length,
            'separate worker, source-pinned radar/warnings preserved');
          NODE
