name: Verify operator camera stays at selected radar through frame refresh
on:
  push:
    branches: [fix/radar-auto-refresh-camera-lock-20261101]
    paths:
      - .github/workflows/operator-camera-continuity-20261101.yml
      - scripts/test-radar-camera-continuity-browser-20261101.mjs
      - frontend/src/live3d-operational-v9.js
      - frontend/src/radar-viewport-continuity-v1.js
      - frontend/tests/run-radar-viewport-continuity-v1-tests.mjs
      - frontend/tests/run-radar-auto-refresh-v10-2-37-tests.mjs
      - scripts/apply-radar-auto-refresh-v1.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operator-camera-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
      - uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
      - uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
      - name: Assemble actual deployed StormTracker package
        run: |
          bash scripts/build-current-site.sh
          python scripts/apply-ftp-aep-release-v10.py
          python scripts/apply-radar-auto-refresh-v1.py
          grep -Fq 'V10.2.41 OPERATOR CAMERA CONTINUITY' _site/BUILD.txt
          node --check _site/src/live3d-operational-v9.js
          node --check _site/src/radar-viewport-continuity-v1.js
          node frontend/tests/run-radar-viewport-continuity-v1-tests.mjs
          node frontend/tests/run-radar-auto-refresh-v10-2-37-tests.mjs
      - name: Install mobile Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install chromium
      - name: Verify selected Longreach camera survives latest radar load, tab focus and iframe reload
        run: |
          python -m http.server 8137 --bind 127.0.0.1 --directory _site >/tmp/radar-camera-http.log 2>&1 &
          node scripts/test-radar-camera-continuity-browser-20261101.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: camera-longreach-failure
          path: /tmp/radar-camera-lock-failure.png
          if-no-files-found: ignore
