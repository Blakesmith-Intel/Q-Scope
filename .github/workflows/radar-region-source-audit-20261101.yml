name: Radar 30-minute cross-region live source audit (one-off)
on:
  push:
    branches: [fix/radar-region-loop-20261101]
    paths:
      - .github/workflows/radar-region-source-audit-20261101.yml
      - scripts/probe-radar-region-loop-20261101.mjs
      - scripts/probe-full-regional-wmts-20261101.mjs
      - scripts/test-radar-region-switch-browser-20261101.mjs
      - scripts/apply-radar-auto-refresh-v1.py
      - frontend/src/live3d-operational-v9.js
      - frontend/src/live-loop-refresh-v1.js
      - frontend/src/bom-wmts-loop-v2.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe a bounded set of source-published timestamps, comparing region corner and centre
        run: node scripts/probe-radar-region-loop-20261101.mjs
      - name: Verify complete mosaics of the six latest published frames across multiple radar sites
        run: node scripts/probe-full-regional-wmts-20261101.mjs

  browser-site-switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
      - uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
      - uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
      - name: Build actual radar operator package
        run: |
          bash scripts/build-current-site.sh
          python scripts/apply-ftp-aep-release-v10.py
          python scripts/apply-radar-auto-refresh-v1.py
          echo '<!doctype html><title>Radar cross region QA</title>' > _site/ftp-aep-smoke.html
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install chromium
      - name: Exercise real live 30-minute loops when switching regional radar in mobile browser
        run: |
          python -m http.server 8137 --bind 127.0.0.1 --directory _site >/tmp/radar-region-http.log 2>&1 &
          node scripts/test-radar-region-switch-browser-20261101.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: radar-region-mobile-failure
          path: /tmp/radar-region-qa-failure.png
          if-no-files-found: ignore
