name: Probe official Energy Queensland per-council outage JSON sources

on:
  pull_request:
    paths:
      - 'scripts/probe-official-ergon-lga-api-20261113.mjs'
      - 'scripts/probe-published-qld-provider-council-counts-20261113.mjs'
      - 'scripts/audit-official-outage-council-service-catalogue-20261113.mjs'
      - 'frontend/src/context-layers/power-outage-official-lga-allocation-v1.js'
      - 'frontend/tests/run-power-outage-official-lga-allocation-v1-tests.mjs'
      - '.github/workflows/probe-official-ergon-lga-api-20261113.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify existing public provider-backed LGA snapshot, event totals and CORS
        run: node scripts/probe-published-qld-provider-council-counts-20261113.mjs
      - name: Assert official LGA customer allocation reconciliation contract
        run: node frontend/tests/run-power-outage-official-lga-allocation-v1-tests.mjs
      - name: Discover first-party GIS per-council customer allocation services
        run: node scripts/audit-official-outage-council-service-catalogue-20261113.mjs
      # Official domain rejects automated access with 403. Never repeat the
      # blocked source probes on normal PR updates; manual diagnostics only.
      - name: Manual public provider API reachability probe
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/probe-official-ergon-lga-api-20261113.mjs
