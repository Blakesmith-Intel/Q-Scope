name: Audit live BoM warning polygon source without production changes
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit-live-bom-warning-polygon-gap-20261101.mjs"
      - "relay/bom-warning-gis2web-replica-v1.js"
      - "relay/bom-warning-polygons-v1.js"
      - "relay/bom-warning-editions-v1.js"
      - "relay/bom-warning-ftp-v1.js"
      - "scripts/audit-ems-warning-arcgis-public-layers-20261112.mjs"
      - "scripts/diagnose-direct-bom-fwo-worker-transport-20261112.mjs"
      - "scripts/probe-live-qscope-warning-editions-20261112.mjs"
      - "relay/bom-warning-product-reconcile-v1.js"
      - "frontend/src/context-layers/bom-warning-cap-source-v1.js"
      - ".github/workflows/warning-polygon-source-audit-20261101.yml"
permissions:
  contents: read
jobs:
  identify-source-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - name: Inspect live BoM CAP, Queensland current listing, ArcGIS GIS2Web and production Cloudflare relay
        run: |
          node --check scripts/audit-live-bom-warning-polygon-gap-20261101.mjs
          node scripts/audit-live-bom-warning-polygon-gap-20261101.mjs
      - name: Check the candidate relay against live, independently counted IDQ21033 and IDQ21035 GIS2Web features and LGA/DDMG intersections
        run: |
          node --check scripts/smoke-live-candidate-warning-relay-20261111.mjs
          node scripts/smoke-live-candidate-warning-relay-20261111.mjs
      - name: Verify genuine live warning editions for regional, detailed and severe weather products
        run: |
          node --check scripts/probe-live-qscope-warning-editions-20261112.mjs
          node scripts/probe-live-qscope-warning-editions-20261112.mjs

      - name: Audit all published EMS warning layers and alternative public ArcGIS views
        run: |
          node --check scripts/audit-ems-warning-arcgis-public-layers-20261112.mjs
          node scripts/audit-ems-warning-arcgis-public-layers-20261112.mjs
      - name: Probe actual published BoM FWO HTTPS availability and existing Worker FTP transport
        run: |
          node scripts/diagnose-direct-bom-fwo-worker-transport-20261112.mjs
