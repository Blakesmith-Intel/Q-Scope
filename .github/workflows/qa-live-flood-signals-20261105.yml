name: Diagnose real BoM flood signals to map decision (read-only)
on:
  pull_request:
    paths:
      - scripts/audit-live-flood-signals-20261105.mjs
      - .github/workflows/qa-live-flood-signals-20261105.yml
      - frontend/src/context-layers/river-gauge-layer-v1.js
      - frontend/src/context-layers/river-gauge-observations-v1.js
      - frontend/src/context-layers/river-flood-events-v1.js
      - frontend/src/context-layers/severity-marker-layer-v1.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-flood-gauge-audit:
    name: Compare real source, matches, classifications, and render candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check exact live flood evaluation path
        env:
          NODE_USE_ENV_PROXY: '1'
        run: |
          node --check scripts/audit-live-flood-signals-20261105.mjs
          node scripts/audit-live-flood-signals-20261105.mjs
