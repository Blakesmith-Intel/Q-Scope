name: Q-SCOPE V10.7 non-overlap original BoM legend and persistent radar events — WebKit Chromium

on:
  pull_request:
    paths:
      - "frontend/src/qscope-event-dock-layout-v10-7.js"
      - "frontend/src/qscope-event-dock-layout-v10-7.css"
      - "frontend/tests/run-qscope-event-dock-layout-v10-7-tests.mjs"
      - "scripts/test-qscope-event-dock-browser-v10-7.mjs"
      - "scripts/apply-qscope-radar-event-layout-v10-7.py"
      - "scripts/build-current-site.sh"
      - ".github/workflows/qa-qscope-event-dock-v10-7.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qscope-event-dock-v10-7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  interactive-qa:
    name: Q-SCOPE original legend/alert layout (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        platform: [mobile, desktop]
    steps:
      - name: Checkout Q-SCOPE candidate
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Checkout accepted V9.18 diagnostic source
        uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
          persist-credentials: false
      - name: Checkout pinned V10.2 production source
        uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
          persist-credentials: false
      - name: Checkout pinned original V10.3 wind / hook research preview
        uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
          persist-credentials: false
      - name: Build seven QA previews; verify no BoM legend/alert intersection
        run: |
          set -euo pipefail
          node frontend/tests/run-qscope-event-dock-layout-v10-7-tests.mjs
          bash scripts/build-current-site.sh
          python scripts/apply-ftp-aep-release-v10.py
          python scripts/apply-radar-auto-refresh-v1.py
          test "$(find _site/preview -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 7
          # Test of the pinned V10.5 inbox remains valid with an added
          # isolated V10.6 preview. Never delete or rewrite V10.5.
          grep -Fq 'Q-SCOPE V10.7 NON-OVERLAP ALERT DOCK' _site/preview/wind-hook-v10-7/BUILD.txt
          grep -Fq 'Q-SCOPE QUEENSLAND OPERATOR BRANDING' _site/BUILD.txt
          ! grep -Fq 'enableWindHookResearch' _site/preview/wind-hook-v10-7/src/live3d-operational-v9.js
      - name: Install tested browser engine
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps ${{ matrix.platform == 'mobile' && 'webkit' || 'chromium' }}
      - name: Verify real alert interactions, frame navigation and mobile fit
        env:
          STORMTRACKER_BROWSER: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          python -m http.server 8137 --bind 127.0.0.1 --directory _site > /tmp/qscope-v10-7-layout.log 2>&1 &
          sleep 2
          node scripts/test-qscope-event-dock-browser-v10-7.mjs
