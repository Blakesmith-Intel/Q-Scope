name: Prepare one-time independently verified QLD BoM station reference
on:
  push:
    branches: [fix/simple-bom-gauge-catalogue-20261110]
    paths:
      - scripts/generate-verified-qld-bom-gauge-reference-20261110.mjs
      - .github/workflows/seed-verified-qld-bom-gauge-reference-20261110.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simple-bom-gauge-catalogue-20261110
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch, exact-ID validate and publish immutable reference into repair branch
        run: |
          node scripts/generate-verified-qld-bom-gauge-reference-20261110.mjs
          node --check relay/qld-bom-gauge-reference-20261110-v1.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/qld-bom-gauge-reference-20261110-v1.js
          git commit -m "Seed 2026 Queensland gauge locations from validated government source"
          git push origin HEAD:fix/simple-bom-gauge-catalogue-20261110
